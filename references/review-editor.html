dex:5;background:#245f73;color:#fff;border:0}.selected .move,.selected .resize{display:block}.move{left:-1px;top:-24px;height:23px;font-size:12px;padding:2px 8px;cursor:move;border-radius:4px 4px 0 0}.resize{right:-5px;bottom:-5px;width:15px;height:15px;cursor:nwse-resize;border:2px solid #fff;border-radius:3px}.pin{position:absolute;transform:translate(-50%,-50%);border:2px solid white;background:#bb7531;color:white;width:25px;height:25px;border-radius:50%;padding:0;font-size:12px;z-index:6;touch-action:none;cursor:move}.hint{margin:8px 0 4px;min-height:32px;font-size:12px;color:#607984}.hint.bad{color:#9c5c16}aside{position:sticky;top:16px;align-self:start;background:#fff;border:1px solid #dae2e7;border-radius:10px;padding:17px;max-height:90vh;overflow:auto}aside h2{font-size:17px;margin:0 0 12px}aside label{display:block;margin:12px 0 6px;color:#4e6775}aside textarea{width:100%;min-height:110px;border:1px solid #b9cbd3;padding:8px;resize:vertical;font:inherit}aside input[type=number]{width:100%;padding:7px;border:1px solid #b9cbd3;border-radius:4px}.coords{display:grid;grid-template-columns:1fr 1fr;gap:8px}.coords label{margin:4px 0;font-size:12px}.help{font-size:12px;color:#617482;line-height:1.7}.note-item{display:block;width:100%;text-align:left;margin:8px 0;overflow-wrap:anywhere}.empty{color:#6a7c87;line-height:1.8}footer{text-align:center;padding:16px 20px 30px;color:#617482;font-size:12px}.active-note{outline:3px solid #f3c27d}.note-mode{cursor:crosshair}#auto{display:inline-block}#selection-tools[hidden],#note-tools[hidden]{display:none}@media(max-width:1000px){.workspace{grid-template-columns:minmax(0,1fr) 250px}}@media(max-width:700px){header{padding:16px}.workspace{display:flex;flex-direction:column;padding:0 14px}aside{position:static;order:-1;max-height:460px}#grid{grid-template-columns:1fr}.toolbar button,.file{padding:8px}.coords{grid-template-columns:repeat(4,1fr)}}

</style></head><body>
<header><h1 id="title"></h1><p>点击文字编辑；选中后拖动“移动”标签调整位置，拖右下角调整文本框。批注只给 Agent 看，不会变成商品文案。</p>
<div class="toolbar"><button class="primary" id="export">导出修改稿</button><label class="file">载入修改稿<input id="import" type="file" accept=".json,application/json"></label><button id="undo">撤销</button><button id="redo">重做</button><button id="zoom">放大查看</button><button id="reset">恢复初始稿</button><label><input type="checkbox" id="auto" checked>加字时自动增高</label></div><div id="status" role="status" aria-live="polite"></div></header>
<div class="workspace"><main id="grid"></main><aside><h2 id="selection-title">编辑工具</h2><div id="empty" class="empty">点击任一屏的文字，或使用该屏下方的“新增文案”“添加批注”。</div><div id="selection-tools" hidden><label for="copy-editor">选中文案</label><textarea id="copy-editor"></textarea><div class="coords"><label>左边距 %<input id="pos-x" type="number" min="0" max="100" step="0.5"></label><label>上边距 %<input id="pos-y" type="number" min="0" max="100" step="0.5"></label><label>宽度 %<input id="pos-w" type="number" min="3" max="100" step="0.5"></label><label>高度 %<input id="pos-h" type="number" min="2" max="100" step="0.5"></label></div><label>字号（设计稿像素）<input id="font-size" type="number" min="8" max="180" step="1"></label><button id="fit" style="margin-top:12px">文本框适应内容</button><p class="help">超出画布或与其他模块重叠时仍可导出，Agent 会复核。移动标签获得焦点后，可用方向键微调；Shift 加速。</p></div><button id="delete-text" style="margin:12px 0;color:#a5392e" hidden>删除选中模块</button><div id="note-tools" hidden><label for="note-editor">批注内容（不参与出图）</label><textarea id="note-editor" placeholder="例如：这里的主标题再靠左，产品放大一点"></textarea><button id="delete-note" style="margin-top:10px">删除这条批注</button></div><h3 style="font-size:14px">当前屏所有模块</h3><div id="module-list"></div><h3 style="font-size:14px">当前屏批注</h3><div id="notes"></div></aside></div>
<footer>修改稿包含文案、位置、尺寸和批注。请导出 JSON 交给 Agent；此页面不会覆盖原文件或启动生图。关闭前请确认下载已保存。</footer>
<script id="data" type="application/json">/*__PAYLOAD__*/</script>
<script>
'use strict';
/* MODEL_START */
const clone=x=>JSON.parse(JSON.stringify(x));
const editable=b=>b.type==='text'||b.type==='annotation';
const finite=x=>typeof x==='number'&&Number.isFinite(x);
const get=(obj,path)=>path.split('.').reduce((v,k)=>v[k],obj);
function set(obj,path,value){const keys=path.split('.');if(keys.some(k=>['__proto__','constructor','prototype'].includes(k)))throw Error('非法文案路径');let p=obj;for(const k of keys.slice(0,-1))p=p[k];p[keys.at(-1)]=value;}
function stable(v){if(Array.isArray(v))return v.map(stable);if(v&&typeof v==='object')return Object.fromEntries(Object.keys(v).sort().map(k=>[k,stable(v[k])]));return v;}
const same=(a,b)=>JSON.stringify(stable(a))===JSON.stringify(stable(b));
function omit(obj,keys){return Object.fromEntries(Object.entries(obj).filter(([k])=>!keys.includes(k)));}
function validBox(b){return Array.isArray(b)&&b.length===4&&b.every(finite)&&b[0]>=0&&b[1]>=0&&b[2]>0&&b[3]>0&&b[0]+b[2]<=1.000001&&b[1]+b[3]<=1.000001;}
function constrain(box){let [x,y,w,h]=box;w=Math.min(1,Math.max(.03,w));h=Math.min(1,Math.max(.02,h));return [Math.max(0,Math.min(1-w,x)),Math.max(0,Math.min(1-h,y)),w,h];}
function moveBox(box,dx,dy){return constrain([box[0]+dx,box[1]+dy,box[2],box[3]]);}
function resizeBox(box,dx,dy){return [box[0],box[1],Math.min(1-box[0],Math.max(.03,box[2]+dx)),Math.min(1-box[1],Math.max(.02,box[3]+dy))];}
function copyCompatible(base,value){if(typeof base==='string')return typeof value==='string'&&value.length<=20000;if(!base||!value||typeof value!=='object'||Array.isArray(base)!==Array.isArray(value))return false;return same(Object.keys(base).sort(),Object.keys(value).sort())&&Object.keys(base).every(k=>!['__proto__','constructor','prototype'].includes(k)&&copyCompatible(base[k],value[k]));}
function importPlan(original,incoming,hash){
 if(!incoming||incoming.review_state?.source_plan_sha256!==hash)throw Error('这份修改稿不属于当前审核页。');
 if(!same(omit(original,['pages','review_state']),omit(incoming,['pages','review_state']))||!Array.isArray(incoming.pages)||incoming.pages.length!==original.pages.length)throw Error('页数或原始方案结构被修改。');
 const result=clone(original);
 original.pages.forEach((base,i)=>{const source=incoming.pages[i];const page={...source,layout:{...source?.layout,blocks:Array.isArray(source?.layout?.blocks)?source.layout.blocks.map(b=>b&&{...b}):source?.layout?.blocks}};
  if(!same(omit(base,['text_exact','layout','review_annotations']),omit(page,['text_exact','layout','review_annotations']))||!same(omit(base.layout,['blocks']),omit(page.layout||{},['blocks'])))throw Error('页面信息被修改。');
  if(!Array.isArray(page.layout.blocks)||page.layout.blocks.length>base.layout.blocks.length+80)throw Error('模块数量无效。');
  const ids=new Set(),baseIds=new Set(base.layout.blocks.map(b=>b.id)),extras=[];
  for(const b of page.layout.blocks){if(!b||typeof b.id!=='string'||ids.has(b.id))throw Error('模块ID重复或无效。');ids.add(b.id);if(!baseIds.has(b.id)){if(!/^user_text_\d+$/.test(b.id)||b.type!=='text'||b.copy_key!==b.id||Object.keys(b).some(k=>!['id','type','copy_key','box','font_size','color','align'].includes(k)))throw Error('只允许新增普通文案模块。');extras.push(b.id);}}
  for(const v of page.layout.blocks)if(Array.isArray(v.overlap_with))v.overlap_with=v.overlap_with.filter(id=>!baseIds.has(id)||ids.has(id));
  for(const b of base.layout.blocks){const v=page.layout.blocks.find(x=>x.id===b.id);if(!v)continue;const canonical=clone(b);if(Array.isArray(canonical.overlap_with))canonical.overlap_with=canonical.overlap_with.filter(id=>ids.has(id));const keys=editable(b)?['box','font_size']:[];if(!same(omit(canonical,keys),omit(v,keys)))throw Error('图片路径或模块属性被修改。');}
  for(const b of page.layout.blocks)if(b.type==='annotation'&&!page.layout.blocks.some(v=>v.id===b.target?.block_id&&['image','placeholder','sketch'].includes(v.type)))throw Error('标注目标已不存在。');
  for(const b of page.layout.blocks)if(editable(b)){if(!validBox(b.box)||!finite(b.font_size??32)||(b.font_size??32)<8||(b.font_size??32)>180)throw Error('文本框位置、尺寸或字号无效。');if(b.color!==undefined&&!/^#[0-9a-fA-F]{6}$/.test(b.color)&&!(baseIds.has(b.id)&&b.color===base.layout.blocks.find(v=>v.id===b.id).color))throw Error('文字颜色无效。');if(b.align!==undefined&&!['left','center','right'].includes(b.align))throw Error('对齐方式无效。');}
  const actual=copyLeaves(page.text_exact||{}), expected=new Set(page.layout.blocks.filter(editable).map(b=>b.copy_key));
  if(!same(Object.keys(actual).sort(),[...expected].sort())||Object.values(actual).some(v=>typeof v!=='string'||v.length>20000))throw Error('文案与保留模块不匹配。');
  for(const id of extras)if(typeof page.text_exact[id]!=='string'||page.text_exact[id].length>20000)throw Error('新增文案无效。');
  const notes=page.review_annotations||[];if(!Array.isArray(notes)||notes.length>100)throw Error('批注数量无效。');const nids=new Set();for(const n of notes){if(!n||Object.keys(n).some(k=>!['id','x','y','text'].includes(k))||!/^note_\d+$/.test(n.id)||nids.has(n.id)||!finite(n.x)||!finite(n.y)||n.x<0||n.x>1||n.y<0||n.y>1||typeof n.text!=='string'||n.text.length>20000)throw Error('批注数据无效。');nids.add(n.id);}
  result.pages[i].text_exact=clone(page.text_exact);result.pages[i].layout.blocks=clone(page.layout.blocks);result.pages[i].review_annotations=clone(notes);
 });return result;
}
function addText(page){let i=1;while(Object.hasOwn(page.text_exact,'user_text_'+i)||page.layout.blocks.some(b=>b.id==='user_text_'+i))i++;const id='user_text_'+i;page.text_exact[id]='新增文案';const block={id,type:'text',copy_key:id,box:[.08,.40,.60,.08],font_size:32,color:'#233747'};page.layout.blocks.push(block);return block;}
function copyLeaves(obj,prefix=''){if(typeof obj==='string')return {[prefix]:obj};if(!obj||typeof obj!=='object')throw Error('文案字段无效');const out={};for(const [k,v] of Object.entries(obj)){if(['__proto__','constructor','prototype'].includes(k))throw Error('非法字段');Object.assign(out,copyLeaves(v,prefix?prefix+'.'+k:k));}return out;}
function removeCopy(obj,path){const parts=path.split('.');function walk(node,depth){const out=Object.fromEntries(Object.entries(node));const k=parts[depth];if(depth===parts.length-1)delete out[k];else{out[k]=walk(out[k],depth+1);if(!Object.keys(out[k]).length)delete out[k];}return out;}return walk(obj,0);}
function canDeleteText(base,page,id){return page.layout.blocks.some(b=>b.id===id);}
function deleteText(base,page,id){if(!canDeleteText(base,page,id))throw Error('模块不存在。');const removed=new Set([id]);for(const b of page.layout.blocks)if(b.type==='annotation'&&b.target?.block_id===id)removed.add(b.id);const deleted=page.layout.blocks.filter(b=>removed.has(b.id));page.layout.blocks=page.layout.blocks.filter(b=>!removed.has(b.id));for(const b of page.layout.blocks)if(Array.isArray(b.overlap_with))b.overlap_with=b.overlap_with.filter(target=>!removed.has(target));for(const b of deleted)if(editable(b)&&!page.layout.blocks.some(x=>editable(x)&&x.copy_key===b.copy_key))page.text_exact=removeCopy(page.text_exact,b.copy_key);}
function addNote(page,x,y){const notes=page.review_annotations??=[];let i=1;while(notes.some(n=>n.id==='note_'+i))i++;const note={id:'note_'+i,x:Math.max(0,Math.min(1,x)),y:Math.max(0,Math.min(1,y)),text:''};notes.push(note);return note;}
function makeExport(plan,hash,overflow,overlaps){const value=clone(plan);value.review_state={source_plan_sha256:hash,status:'draft_needs_agent_review',generation_authorized:false,prompts_require_recompile:true,layout_changed:true,empty_page_ids:plan.pages.filter(p=>p.layout.blocks.length===0).map(p=>p.slice_id),browser_overflow_count:overflow,browser_overlap_count:overlaps,editor_version:2,exported_at:new Date().toISOString()};return value;}
/* MODEL_END */
const payload=JSON.parse(document.getElementById('data').textContent),original=payload.plan;
let plan=clone(original),dirty=false,fields=[],selection=null,activePage=0,noteMode=null,history=[],future=[];
const $=id=>document.getElementById(id),grid=$('grid');
function message(s,bad=false){$('status').textContent=s;$('status').className=bad?'error':'';}
function checkpoint(){history.push(clone(plan));if(history.length>60)history.shift();future=[];buttons();}
function buttons(){$('undo').disabled=!history.length;$('redo').disabled=!future.length;}
function changed(){dirty=true;buttons();checks();message('修改已保留在当前页面，尚未导出。');}
function clearSelection(){selection=null;document.querySelectorAll('.module.selected,.pin.active-note').forEach(e=>e.classList.remove('selected','active-note'));}
function activatePage(index){if(selection?.page!==index)clearSelection();activePage=index;}
function selected(){if(!selection||selection.page!==activePage)return null;const page=plan.pages[selection.page];return selection.note?(page.review_annotations||[]).find(n=>n.id===selection.id):page.layout.blocks.find(b=>b.id===selection.id);}
function choose(page,id,note=false){activePage=page;selection={page,id,note};document.querySelectorAll('.module').forEach(e=>e.classList.toggle('selected',+e.dataset.page===page&&e.dataset.id===id&&!note));document.querySelectorAll('.pin').forEach(e=>e.classList.toggle('active-note',+e.dataset.page===page&&e.dataset.id===id&&note));panel();}
function panel(){const b=selected();$('selection-title').textContent=`第 ${plan.pages[activePage].slice_id} 屏 · 编辑工具`;$('empty').hidden=!!b;$('selection-tools').hidden=!b||!!selection?.note||!editable(b);$('note-tools').hidden=!b||!selection?.note;
 $('delete-text').hidden=!b||!!selection?.note||!canDeleteText(original.pages[activePage],plan.pages[activePage],b.id);
 if(b&&selection.note)$('note-editor').value=b.text;
 else if(b&&editable(b)){$('copy-editor').value=get(plan.pages[activePage].text_exact,b.copy_key);['x','y','w','h'].forEach((k,i)=>$('pos-'+k).value=+(b.box[i]*100).toFixed(2));$('font-size').value=b.font_size||32;}
 const modules=$('module-list');modules.replaceChildren();for(const block of plan.pages[activePage].layout.blocks){const btn=document.createElement('button');btn.className='note-item';btn.textContent=editable(block)?get(plan.pages[activePage].text_exact,block.copy_key).slice(0,35):(block.label||block.type+' · '+block.id);btn.onclick=()=>choose(activePage,block.id);modules.append(btn);}
 const list=$('notes');list.replaceChildren();for(const [i,n] of (plan.pages[activePage].review_annotations||[]).entries()){const btn=document.createElement('button');btn.className='note-item';btn.textContent=`${i+1}. ${n.text||'未填写批注'}`;btn.onclick=()=>choose(activePage,n.id,true);list.append(btn);}if(!list.children.length)list.textContent='暂无批注';
}
function geometry(f){const [x,y,w,h]=f.block.box;Object.assign(f.wrap.style,{left:x*100+'%',top:y*100+'%',width:w*100+'%',height:h*100+'%'});f.el.style.fontSize=(f.block.font_size||32)*f.canvas.clientWidth/(plan.design_width||720)+'px';if(f.line){const target=payload.annotation_targets?.[f.page]?.[f.block.id];if(target){f.line.setAttribute('x1',x+w/2);f.line.setAttribute('y1',y+h/2);f.line.setAttribute('x2',target[0]);f.line.setAttribute('y2',target[1]);}}}
function fitField(f,onlyGrow=false){const old=f.el.style.height;f.el.style.height='1px';const need=f.el.scrollHeight+4;f.el.style.height=old;const h=Math.min(1-f.block.box[1],Math.max(.02,need/f.canvas.clientHeight));if(!onlyGrow||h>f.block.box[3])f.block.box[3]=h;geometry(f);}
function checkOverlap(a,b){return Math.min(a[0]+a[2],b[0]+b[2])>Math.max(a[0],b[0])+.001&&Math.min(a[1]+a[3],b[1]+b[3])>Math.max(a[1],b[1])+.001;}
function checks(){let overflow=0,overlaps=0;for(const [i,page] of plan.pages.entries()){let count=0,oc=0;for(const f of fields.filter(f=>f.page===i)){const bad=f.el.scrollHeight>f.el.clientHeight+3||f.el.scrollWidth>f.el.clientWidth+3;f.el.classList.toggle('overflow',bad);f.el.setAttribute('aria-invalid','false');if(bad)count++;}
 const blocks=page.layout.blocks;for(let a=0;a<blocks.length;a++)for(let b=a+1;b<blocks.length;b++)if((editable(blocks[a])||editable(blocks[b]))&&checkOverlap(blocks[a].box,blocks[b].box)&&!blocks[a].overlap_with?.includes(blocks[b].id)&&!blocks[b].overlap_with?.includes(blocks[a].id))oc++;
 const hint=grid.querySelector(`[data-card="${i}"] .hint`);if(hint){hint.textContent=!blocks.length?'这一屏已删空，仍保留页数；请补充内容或交给 Agent 确认是否删页。':count||oc?`${count?count+'处文案空间不足，可扩大文本框；':''}${oc?oc+'处模块重叠；':''}仍可导出交给 Agent 复核。`:'可编辑、拖动、缩放文案；批注仅用于沟通。';hint.classList.toggle('bad',!blocks.length||!!(count||oc));}overflow+=count;overlaps+=oc;}return {overflow,overlaps};}
function drag(e,f,resize=false){e.preventDefault();e.stopPropagation();choose(f.page,f.block.id);checkpoint();const start=[e.clientX,e.clientY],box=[...f.block.box],rect=f.canvas.getBoundingClientRect(),target=e.currentTarget;target.setPointerCapture?.(e.pointerId);let moved=false;
 const move=ev=>{if(ev.pointerId!==e.pointerId)return;const dx=(ev.clientX-start[0])/rect.width,dy=(ev.clientY-start[1])/rect.height;f.block.box=resize?resizeBox(box,dx,dy):moveBox(box,dx,dy);moved=true;geometry(f);panel();checks();};
 const end=ev=>{if(ev.pointerId!==e.pointerId)return;target.removeEventListener('pointermove',move);target.removeEventListener('pointerup',end);target.removeEventListener('pointercancel',end);if(moved)changed();else{history.pop();buttons();}};target.addEventListener('pointermove',move);target.addEventListener('pointerup',end);target.addEventListener('pointercancel',end);
}
function pinDrag(e,page,n,canvas){e.preventDefault();e.stopPropagation();choose(page,n.id,true);checkpoint();const r=canvas.getBoundingClientRect(),start=[e.clientX,e.clientY],old=[n.x,n.y],target=e.currentTarget;target.setPointerCapture?.(e.pointerId);const move=ev=>{if(ev.pointerId!==e.pointerId)return;n.x=Math.max(0,Math.min(1,old[0]+(ev.clientX-start[0])/r.width));n.y=Math.max(0,Math.min(1,old[1]+(ev.clientY-start[1])/r.height));target.style.left=n.x*100+'%';target.style.top=n.y*100+'%';};const end=ev=>{if(ev.pointerId!==e.pointerId)return;target.removeEventListener('pointermove',move);target.removeEventListener('pointerup',end);target.removeEventListener('pointercancel',end);changed();};target.addEventListener('pointermove',move);target.addEventListener('pointerup',end);target.addEventListener('pointercancel',end);}

 const canvas=document.createElement('div');canvas.className='canvas';const ratio=(page.aspect_ratio||plan.aspect_ratio).split(':').map(Number);canvas.style.aspectRatio=`${ratio[0]} / ${ratio[1]}`;const bg=document.createElement('img');bg.src=payload.backgrounds[index];bg.alt='布局草图背景';canvas.append(bg);const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add('leaders');svg.setAttribute('viewBox','0 0 1 1');svg.setAttribute('preserveAspectRatio','none');canvas.append(svg);

 for(const block of page.layout.blocks){if(!editable(block)){const layer=document.createElement('div');layer.className='module visual';layer.dataset.page=index;layer.dataset.id=block.id;const [x,y,w,h]=block.box;Object.assign(layer.style,{left:x*100+'%',top:y*100+'%',width:w*100+'%',height:h*100+'%',cursor:'pointer'});const img=document.createElement('img');img.src=payload.visual_layers[index][block.id];img.alt=block.label||block.type;Object.assign(img.style,{width:'100%',height:'100%',display:'block'});layer.append(img);layer.onclick=e=>{e.stopPropagation();choose(index,block.id);};canvas.append(layer);continue;}const wrap=document.createElement('div');wrap.className='module';wrap.dataset.page=index;wrap.dataset.id=block.id;const el=document.createElement('textarea');el.className='copy';el.value=get(page.text_exact,block.copy_key);el.setAttribute('aria-label',`第${page.slice_id}屏 ${block.copy_key}`);el.spellcheck=false;el.wrap='soft';Object.assign(el.style,{color:block.color||'#183B56',textAlign:block.align||'left'});wrap.append(el);const handle=document.createElement('button');handle.className='move';handle.type='button';handle.textContent='移动';handle.setAttribute('aria-label',`移动第${page.slice_id}屏 ${block.copy_key}`);wrap.append(handle);const resize=document.createElement('button');resize.className='resize';resize.type='button';resize.setAttribute('aria-label',`调整第${page.slice_id}屏 ${block.copy_key}尺寸`);wrap.append(resize);canvas.append(wrap);
 const f={el,wrap,canvas,block,page:index};if(block.type==='annotation'){const line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('stroke','#607f96');line.setAttribute('stroke-width','.002');svg.append(line);f.line=line;}
 el.addEventListener('focus',()=>{choose(index,block.id);checkpoint();});el.addEventListener('input',()=>{set(page.text_exact,block.copy_key,el.value);if($('auto').checked)fitField(f,true);panel();changed();});handle.onpointerdown=e=>drag(e,f);resize.onpointerdown=e=>drag(e,f,true);handle.onkeydown=e=>{const delta={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(delta){e.preventDefault();checkpoint();const s=e.shiftKey?10:1;block.box=moveBox(block.box,delta[0]*s/(plan.design_width||720),delta[1]*s/((plan.design_width||720)*ratio[1]/ratio[0]));geometry(f);panel();changed();}};fields.push(f);}
 for(const [i,n] of (page.review_annotations||[]).entries()){const pin=document.createElement('button');pin.className='pin';pin.dataset.page=index;pin.dataset.id=n.id;pin.style.left=n.x*100+'%';pin.style.top=n.y*100+'%';pin.textContent=i+1;pin.setAttribute('aria-label',`第${page.slice_id}屏批注${i+1}`);pin.title=n.text||'填写批注';pin.onpointerdown=e=>pinDrag(e,index,n,canvas);pin.onclick=e=>{e.stopPropagation();choose(index,n.id,true);};canvas.append(pin);}
 card.append(canvas);const hint=document.createElement('div');hint.className='hint';card.append(hint);grid.append(card);});scale();if(selection&&selected())choose(selection.page,selection.id,selection.note);else{selection=null;panel();}buttons();}
